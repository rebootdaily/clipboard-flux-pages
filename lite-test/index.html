<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Lite TEST">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Field Lite TEST</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mute:#66707d;--line:#d8dee6;--pri:#1f4e79;--pri2:#2f6fab;--on:#1f4e79;--onink:#fff;--warn:#b3261e;--ok:#2e7d32;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e6ebf1;--mute:#9aa5b2;--line:#2c3643;--pri:#5b9be0;--pri2:#7fb2ea;--on:#3d7cc4;--onink:#fff;--chip:#232c38}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:7px 11px;font-weight:600}
nav#tabs{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:19;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:0 0 auto;border:0;background:none;padding:11px 12px;font-size:14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button.act{color:var(--pri);border-bottom-color:var(--pri)}
nav#tabs button small{font-weight:500;opacity:.75;margin-left:3px}
main{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--pri)}
.f{padding:8px 0;border-top:1px solid var(--line)}
.f:first-of-type{border-top:0}
.f>label,.f>.lb{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:18px;padding:7px 12px;font-size:14px;min-height:36px}
.chip.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.chip.add{border-style:dashed;background:none;color:var(--mute)}
.chip b{font-weight:700}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.warn{color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:14px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--chip);width:40px;height:38px;font-size:20px;font-weight:700}
.step span{min-width:36px;text-align:center;font-weight:700}
.muted{color:var(--mute);font-size:13px}
.list .it{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.rooms{border-collapse:collapse;width:100%;font-size:13px}
table.rooms th,table.rooms td{border:1px solid var(--line);padding:2px;text-align:center}
table.rooms th{background:var(--chip);font-weight:600;padding:5px 3px}
table.rooms td.n{min-width:34px}
table.rooms td button{border:0;background:none;width:100%;min-height:36px;font-weight:700;font-size:15px}
table.rooms td button.z{color:var(--mute);font-weight:400}
.scrollx{overflow-x:auto}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-weight:700}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.shot{position:relative;border:1px dashed var(--line);border-radius:10px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:4px;background:var(--chip);overflow:hidden}
.shot.has{border-style:solid;border-color:var(--ok)}
.shot img{width:100%;height:72px;object-fit:cover;border-radius:6px}
.shot .cnt{position:absolute;top:4px;right:4px;background:var(--ok);color:#fff;border-radius:10px;padding:0 6px;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:100%;height:80px;object-fit:cover;border-radius:6px;display:block}
.thumbs figcaption{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs .x{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;padding:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick figure{margin:0;position:relative;border:3px solid transparent;border-radius:10px;overflow:hidden;background:var(--chip);cursor:pointer}
.pick figure.on{border-color:var(--pri)}
.pick img{width:100%;height:110px;object-fit:cover;display:block}
.pick .ck{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:transparent;font-weight:800;line-height:24px;text-align:center}
.pick figure.on .ck{background:var(--pri);color:#fff}
.pick .x{position:absolute;top:5px;right:5px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;padding:0}
.pick select{width:100%;border:0;border-radius:0;padding:6px;font-size:13px;display:none}
.pick figure.on select{display:block}
#sk{width:100%;height:46vh;min-height:260px;background:var(--bg);border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
.skctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pad button{height:44px;font-size:20px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--chip)}
.pad button.pen{font-size:13px}
.pad button.dir{background:var(--pri);color:#fff;border-color:var(--pri)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.keys button{height:36px;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lenbox{font-size:22px;font-weight:700;border:2px solid var(--pri);border-radius:10px;padding:4px 10px;text-align:right;margin-bottom:5px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tally .tc{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--bg)}
.tally .tl{font-weight:800;font-size:15px}
.tally .ts{font-size:12px;color:var(--mute)}
.tally .tn{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.tally .tb2{display:grid;grid-template-columns:1fr 1.6fr;gap:6px}
.tally button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:30px;font-weight:800;touch-action:manipulation}
.tally button.plus{background:var(--pri);border-color:var(--pri);color:#fff}
.rep .sec{margin-bottom:14px}
.rep .sec h3{font-size:14px;margin:0 0 4px;color:var(--pri);display:flex;justify-content:space-between;align-items:center}
.rep .kv{display:flex;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer}
.rep .kv:active,.rep .kv.cp{background:var(--chip)}
.rep .kv .k{width:42%;color:var(--mute);font-size:13px}
.rep .kv .v{flex:1;font-weight:600;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:.95}
footer#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;justify-content:center;z-index:20}
footer#bar .btn{flex:1;max-width:200px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;font-size:15px}
.hide{display:none!important}
@media print{header,nav,footer,#toast,.noprint{display:none!important}body,main{background:#fff;color:#000;padding:0}.card{border:0;padding:0}.rep .kv{padding:2px 0;break-inside:avoid}.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pgrid figure{margin:0;break-inside:avoid}.pgrid img{width:100%;max-height:300px;object-fit:contain}}
main.sheetmode{max-width:none;padding:0}
/* The sheet scrolls and zooms inside its own viewport (.sv), so the header, tabs and tools never zoom. */
.sv{position:relative;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg)}
.sv.finger,.sv.finger canvas{touch-action:none}
.tools .zm{min-width:58px;font-variant-numeric:tabular-nums}
.tools{position:sticky;top:calc(env(safe-area-inset-top) + 92px);z-index:15;display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.tools::-webkit-scrollbar{display:none}
.tools>*{flex:0 0 auto}
.tools .tb{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:42px;height:38px;padding:0 9px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tools .tb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tools .tb:disabled{opacity:.35}
.tools .sep{width:1px;height:26px;background:var(--line);margin:0 3px}
.tools .swatch{width:28px;height:28px;border-width:3px}
.tools .dotsz{display:inline-block;border-radius:50%;background:currentColor}
.tools .btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tools .hint{font-size:12px;color:var(--mute);flex:1;min-width:140px}
.sheet{position:relative;margin:8px auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);transform-origin:0 0}
.sheet>img:first-child{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.sheet canvas{position:absolute;left:0;top:0;touch-action:pan-x pan-y}
.sheet .bl{position:absolute;margin:0;min-height:0;border:0;border-radius:2px;background:rgba(31,111,235,.06);color:#0b3d91;padding:0 2px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive,sans-serif;font-weight:600;outline:none;resize:none;line-height:1.1;overflow:hidden;-webkit-appearance:none;appearance:none;box-shadow:none}
.sheet .bl:focus{background:rgba(255,214,0,.28)}
.sheet .ins{position:absolute;display:block;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sheet.imgmode .ins{pointer-events:auto;z-index:6;touch-action:none;cursor:move}
.sheet.imgmode canvas{pointer-events:none}
.sheet .ins.sel{outline:2px dashed #e65100}
.sheet .hd,.sheet .xb{position:absolute;z-index:7;width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:700;line-height:24px;text-align:center;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sheet .hd{background:#e65100;cursor:nwse-resize}
.sheet .xb{background:#c62828;cursor:pointer}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;display:inline-block}
.swatch.on{border-color:var(--ink)}
header{background:#b45309!important}
</style>

</head>
<body>
<header>
  <button id="homeBtn" class="hide" aria-label="All inspections">&#9664;</button>
  <h1 id="title">Field Lite</h1>
</header>
<nav id="tabs" class="hide"></nav>
<main id="main"></main>
<footer id="bar" class="hide">
  <button class="btn" id="prevBtn">&#9664; Back</button>
  <button class="btn pri" id="nextBtn">Next &#9654;</button>
</footer>
<div id="toast"></div>
<input type="file" id="lib" accept="image/*" multiple class="hide">
<input type="file" id="insImg" accept="image/*" class="hide">
<input type="file" id="imp" accept=".zip,application/zip,.json,application/json,image/jpeg" multiple class="hide">
<script src="sheet.js"></script>
<script src="uad26.js"></script>
<script>
'use strict';
/* =====================================================================
   Field Lite - appraisal inspection collector built on the appraiser's
   own paper inspection sheet (sheet.js / sheet-N.png, generated from
   InspectionSheet.pdf). Circle or tap an option to record it; write in
   the blanks (Apple Pencil Scribble / pen handwriting becomes text).
   Everything is stored on the device (IndexedDB); works offline.
   ===================================================================== */

const CACHE_PREFIX = 'fieldlite-test';   // this app's saved copies; the practice copy uses its own prefix so the two never touch each other
const APP_VERSION = '10 TEST';   // shown on the home screen so a screenshot says which version is running
const TABS = [
  ...SHEET.pages.map((_,i)=>({id:'p'+(i+1), page:i+1, title:SHEET.pages.length>1?'Page '+(i+1):'Field Sheet'})),
  {id:'photo', title:'Photos'}, {id:'sketch', title:'Sketch'}, {id:'export', title:'Export'}
];
const PHOTO_SHOTS = {
  imp: ['Front','Rear','Street','Side L','Side R','Address','Kitchen','Living','Dining','Family','Bath','Bedroom','Smoke detector','CO detector','Water heater','HVAC','Electric panel','Roof','Garage','Pool','Patio','Detached bldg','Defect'],
  land:['Front','Street','Street (opposite)','Rear','Side','Address / sign','Access','Adverse','Defect']
};
const AREA_KINDS = ['GLA','Garage','Porch','Patio','Deck','Basement','Carport','Other'];
/* Walk-through room tally on the Sketch tab. Each counter IS the matching write-in box on the field
   sheet (same stored value), so a count tapped here shows on the sheet and in the report - no recount.
   When the sheet is re-mapped, point `box` at the new write-in box ids. */
const TALLY = [
  {box:'t_bed',  label:'BED#',     sub:'Bedrooms'},
  {box:'t_bath', label:'BATH#',    sub:'Full baths'},
  {box:'t_half', label:'1/2 BTH#', sub:'Half baths'}
].filter(t => SHEET.blanks.some(b => b.id === t.box));
const FIELD = Object.fromEntries(SHEET.fields.map(f => [f.id, f]));
const OPT = Object.fromEntries(SHEET.opts.map(o => [o.id, o]));
const OPTS_OF = {};
SHEET.opts.forEach(o => (OPTS_OF[o.f] = OPTS_OF[o.f] || []).push(o));
const PAGE_OPTS = {};
SHEET.pages.forEach((_, i) => (PAGE_OPTS[i+1] = SHEET.opts.filter(o => o.p === i+1)));

/* ---------- Tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600);}

/* ---------- Settings (per device) ---------- */
const SET = {finger:false, color:'#1a3fb0', hl:'#ffd600', size:1, erase:'stroke'};
try{Object.assign(SET, JSON.parse(localStorage.getItem('fieldlite-test.settings')||'{}'));}catch(_){}
function saveSettings(){try{localStorage.setItem('fieldlite-test.settings', JSON.stringify(SET));}catch(_){}}

/* ---------- Storage (IndexedDB) ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('fieldlite-test',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('insp',{keyPath:'id'});const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('insp','insp');};
  r.onsuccess=()=>{db=r.result;res();};r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out?out.result:undefined);t.onerror=()=>rej(t.error);});}
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
const dbGet=(s,k)=>tx(s,'readonly',st=>st.get(k));
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
const allFor=id=>tx('photos','readonly',st=>st.index('insp').getAll(id));            // photos + reference images
const photosFor=async id=>(await allFor(id)).filter(p=>p.kind!=='ref');               // field photos only
const refsFor=async id=>(await allFor(id)).filter(p=>p.kind==='ref');                 // images inserted on the sheet

/* ---------- State ---------- */
let cur=null, tab=0, view='home', saveTimer=null;
const urls=new Map();
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{cur.updated=Date.now();dbPut('insp',cur);},300);}
function newInsp(){return normalize({id:uid(),created:Date.now(),updated:Date.now()});}
function normalize(i){
  i.v=2; i.sel=i.sel||{}; i.txt=i.txt||{}; i.ink=i.ink||{}; SHEET.pages.forEach((_,n)=>{i.ink[n+1]=i.ink[n+1]||[];});
  i.imgs=i.imgs||[]; i.sketch=i.sketch||{areas:[]}; i.date=i.date||(i.f&&i.f.insp_date)||today();
  if(i.f&&!i.txt.address&&i.f.addr)i.txt.address=i.f.addr;   // carry address over from the old chip form
  migrateLayout(i);
  return i;
}
/* The sheet's layout changed (v1: re-spaced rows with the sketch grid at the end; v2: the printed PDF).
   Options and write-ins keep their ids, so selections and text carry over as they are; pen marks and
   inserted images are moved row by row so they land on the same part of the form. */
function migrateLayout(i){
  const v=SHEET.v||1,iv=i.sheetV||1;
  if(iv===v)return;
  const M=SHEET.migrate;
  if(M&&iv===1&&v===2){
    const band=y=>{let best=M[0];for(const m of M){if(y>=m[0]&&y<m[1])return m;if(y>=m[0])best=m;}return best;};
    const map=(x,y)=>{const [o0,o1,n0,n1,a,b]=band(y);return [Math.round((a*x+b)*10)/10,Math.round((n0+(o1>o0?(y-o0)/(o1-o0):0)*(n1-n0))*10)/10];};
    for(const p in i.ink)for(const st of i.ink[p]){
      const a=band(st.pts[0][1])[4];
      st.pts=st.pts.map(q=>{const r=map(q[0],q[1]);return q.length>2?[r[0],r[1],q[2]]:r;});
      st.w=Math.round(st.w*a*100)/100;
    }
    for(const m of i.imgs){const [x0,y0]=map(m.x,m.y),[x1]=map(m.x+m.w,m.y),k=(x1-x0)/m.w;m.x=x0;m.y=y0;m.w=Math.round(m.w*k);m.h=Math.round(m.h*k);}
  }
  i.sheetV=v;
}
const addrOf=i=>(i.txt&&i.txt.address)||(i.f&&i.f.addr)||'';
function isLand(){return SHEET.opts.some(o=>o.f==='prop_type'&&o.v==='VACANT'&&cur.sel[o.id]);}

/* ---------- Home ---------- */
async function showHome(){
  view='home';cur=null;
  $('#title').textContent='Field Lite TEST - practice copy';$('#homeBtn').classList.add('hide');
  $('#tabs').classList.add('hide');$('#bar').classList.add('hide');$('#main').classList.remove('sheetmode');
  const all=(await dbAll('insp')).sort((a,b)=>b.updated-a.updated);
  $('#main').innerHTML=`
   <div class="card"><button class="btn pri" id="newBtn" style="width:100%;padding:16px;font-size:17px">+ New inspection</button></div>
   <div class="card"><h2>Inspections (${all.length})</h2><div class="list">
     ${all.length?all.map(i=>`<div class="it"><div class="t" data-open="${i.id}"><b>${esc(addrOf(i)||'(no address)')}${i.txt&&i.txt.unit?' #'+esc(i.txt.unit):''}</b>
       <span class="muted">${new Date(i.updated).toLocaleString()}</span></div>
       <button class="btn sm" data-open="${i.id}">Open</button><button class="btn sm warn" data-del="${i.id}">&#10005;</button></div>`).join('')
     :'<p class="muted">Nothing yet. Tap New inspection to start.</p>'}
   </div></div>
   <div class="card"><h2>Office</h2>
     <p class="muted">Bring a field package (.zip) onto this computer and import it here. If your computer unzipped it, select inspection.json and the photos together.</p>
     <button class="btn" id="impBtn">Import package (.zip)</button></div>
   <p class="muted" style="text-align:center">TEST COPY: separate from your real Field Lite inspections. Data stays on this device until you export it.<br>Field Lite version ${APP_VERSION} &middot; <a href="#" id="updBtn">Get latest version</a></p>`;

/* Forget the saved copy of the app (never the inspections) and load the newest version from the server. */
async function getLatest(){

/* ---------- Zoom (Goodnotes-style) ----------

   Ctrl + mouse wheel zoom only the sheet. While fingers are down the sheet is scaled with a CSS
   transform (smooth); when they lift it is laid out again at the new size, so text boxes, tap targets
   and ink are exact and sharp. The ink canvas only covers the visible part of the sheet (plus a margin)
   and is redrawn as you scroll, because a canvas the size of a zoomed-in sheet would exceed the
   iPad's canvas memory limit. */

// Where the viewport is looking, as a sheet point (page units) pinned to a screen point.
function captureView(){

// Zoom to z keeping the sheet point under screen point (cx, cy) where it is.

/* The ink canvas: positioned over the visible area of the sheet and redrawn when the view moves. */

/* A recorded option gets a pale blue fill. One you tapped also gets a neat ring; one you circled by hand
   keeps just the fill, so your own circle is the only ring on it. */
function drawSelections(ctx,p){
  const circled=new Set();

  for(const o of PAGE_OPTS[p]){
    if(!cur.sel[o.id])continue;
    ctx.fillStyle='rgba(31,111,235,.20)';ctx.fillRect(o.x,o.y,o.w,o.h);

/* Ink: points are [x, y, pressure?]. Strokes are drawn as smooth curves through the midpoints between samples;

    if(n>1)ctx.lineTo(P[n-1][0],P[n-1][1]);else ctx.lineTo(P[0][0]+0.01,P[0][1]);
    ctx.stroke();ctx.restore();return;

function drawSheet(ctx,p){

function optAt(p,x,y){

const state=p=>({sel:Object.assign({},cur.sel),ink:cur.ink[p].slice()});

function setOpt(o,on){

function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

function recognise(p,st){

function attachInk(cv,ctx,p){
  let st=null,tapStart=null,scrolling=false,raf=0,penDown=false,lastPen=0,fromBox=null;
  const fingers=new Map();   // touches currently down (finger-writing mode only)
  const sheetEl=$('#sheet');
  const pt=e=>{const r=sheetEl.getBoundingClientRect();return [(e.clientX-r.left)/sheetScale,(e.clientY-r.top)/sheetScale];};
  const pinching=()=>Date.now()<pinchUntil;
  const stopStylusScroll=e=>{if([...e.touches].some(t=>t.touchType==='stylus'))e.preventDefault();};
  cv.addEventListener('touchstart',stopStylusScroll,{passive:false});
  cv.addEventListener('touchmove',stopStylusScroll,{passive:false});
  // Palm rejection: while the Pencil is down (and just after), touches and big contact areas are ignored.
  // iPad Safari reports a fingertip as a ~40px-wide contact, so only a much bigger one counts as a palm, and
  // with Finger on (no Pencil in use) contact size is ignored altogether so finger strokes always draw.
  const palm=e=>e.pointerType==='touch'&&(penDown||Date.now()-lastPen<900||(!SET.finger&&(e.width>80||e.height>80)));
  const r1=v=>Math.round(v*10)/10;
  const mk=(ev,pen)=>{const q=pt(ev).map(r1);return pen?[q[0],q[1],Math.round((ev.pressure||0.5)*100)/100]:q;};
  const draws=e=>e.pointerType==='pen'||e.pointerType==='mouse'||(e.pointerType==='touch'&&SET.finger);
  /* Eraser: removes whole strokes, or just the part under it ("part" mode). Its size stays the same on
     screen at any zoom. Erasing a circle un-selects what it circled; with nothing to erase under it, it
     un-selects a tapped option. Strokes are never edited in place, so Undo can always bring them back. */
  const eraseAt=([x,y],px)=>{
    const r=Math.max(3,px/sheetScale),part=SET.erase==='part';
    const segDist=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;let t=l2?((x-a[0])*dx+(y-a[1])*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y);};
    const touches=s=>{const P=s.pts;if(P.length===1)return Math.hypot(P[0][0]-x,P[0][1]-y)<r;for(let i=1;i<P.length;i++)if(segDist(P[i-1],P[i])<r)return true;return false;};
    const kept=[],dropped=[];
    for(const s of cur.ink[p]){
      if(!touches(s)){kept.push(s);continue;}
      dropped.push(s);
      if(!part)continue;
      const P=s.pts,pieces=[];let run=[];
      for(let i=0;i<P.length;i++){
        if(Math.hypot(P[i][0]-x,P[i][1]-y)<r){if(run.length)pieces.push(run);run=[];continue;}
        if(run.length&&segDist(run[run.length-1],P[i])<r){pieces.push(run);run=[];}   // a long step can jump across the eraser
        run.push(P[i]);
      }
      if(run.length)pieces.push(run);
      for(const pc of pieces)if(pc.length>=2)kept.push(Object.assign({},s,{pts:pc,hits:[]}));
    }
    let changed=dropped.length>0;
    if(changed){
      cur.ink[p]=kept;
      const still=new Set(kept.flatMap(s=>s.hits||[]));
      for(const s of dropped)(s.hits||[]).forEach(id=>{if(!still.has(id))delete cur.sel[id];});
    }else{
      const o=optAt(p,x,y);
      if(o&&cur.sel[o.id]&&!cur.ink[p].some(s=>(s.hits||[]).includes(o.id))){delete cur.sel[o.id];changed=true;}
    }
    if(changed){drawSheet(ctx,p);save();}
  };
  const erasePx=e=>e.pointerType==='touch'?22:14;
  cv.onpointerdown=e=>{
    const startedOn=fromBox;fromBox=null;   // set only when a finger touched a writing box (see below)
    if(e.pointerType==='pen'){penDown=true;lastPen=Date.now();}
    if(palm(e)){e.preventDefault();return;}
    if(e.pointerType==='touch'){
      // Two fingers pan and zoom the sheet (attachZoom); here they only cancel what the first finger started.
      fingers.set(e.pointerId,1);
      if(fingers.size>=2||pinching()){
        if(st&&!st.pen){if(!st.erase)hist.pop();st=null;drawSheet(ctx,p);}   // the first finger was a pinch, not a stroke
        tapStart=null;scrolling=true;return;
      }
    }
    if(!draws(e)){tapStart={x:e.clientX,y:e.clientY,t:Date.now()};return;}
    e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}snapshot(p);
    if(tool==='erase'){st={erase:true,pid:e.pointerId};eraseAt(pt(e),erasePx(e));return;}
    const pen=e.pointerType==='pen';
    st=tool==='hl'?{pts:[mk(e,false)],c:SET.hl,w:HL_W[SET.size],k:'hl',pid:e.pointerId}
                  :{pts:[mk(e,pen)],c:SET.color,w:PEN_W[SET.size],pen,pid:e.pointerId};
    if(startedOn)st.box=startedOn;
    if(st.k!=='hl')drawStroke(ctx,st);   // the dot shows immediately
  };
  cv.onpointermove=e=>{
    if(scrolling&&fingers.has(e.pointerId))return;
    if(!st||e.pointerId!==st.pid)return;     // only the pointer that started the stroke can extend it
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    if(st.erase){evs.forEach(ev=>eraseAt(pt(ev),erasePx(ev)));return;}
    const from=st.pts.length;
    for(const ev of evs){const q=mk(ev,st.pen),l=st.pts[st.pts.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>0.5)st.pts.push(q);}
    if(st.pts.length===from)return;
    if(st.k==='hl'){ // one translucent path: redraw it whole (once per frame) so overlaps don't darken
      if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(st){drawSheet(ctx,p);drawStroke(ctx,st);}});
    }else drawStroke(ctx,st,from-1);   // only the new pieces
  };
  const end=e=>{
    if(e.pointerType==='pen'){penDown=false;lastPen=Date.now();}
    if(fingers.delete(e.pointerId)&&scrolling){if(!fingers.size)scrolling=false;tapStart=null;return;}
    if(tapStart&&!st){
      if(pinching()){tapStart=null;return;}   // fingers lifting after a pinch are not a tap
      const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
      if(e.type==='pointerup'&&moved<10&&Date.now()-tapStart.t<450){const o=optAt(p,...pt(e));if(o){snapshot(p);setOpt(o,!cur.sel[o.id]);save();drawSheet(ctx,p);renderTabs();}}
      tapStart=null;return;
    }
    if(!st||e.pointerId!==st.pid)return;     // a palm lifting must not end the Pencil's stroke
    const s=st;st=null;delete s.pid;
    const box=s.box;delete s.box;
    if(s.erase){renderTabs();return;}
    if(s.k==='hl'){ // highlighter: ink only, never circles an option
      if(s.pts.length<2){hist.pop();drawSheet(ctx,p);if(box)box.focus();return;}
      cur.ink[p].push(s);save();drawSheet(ctx,p);renderTabs();return;
    }
    let len=0;for(let i=1;i<s.pts.length;i++)len+=Math.hypot(s.pts[i][0]-s.pts[i-1][0],s.pts[i][1]-s.pts[i-1][1]);
    if(len<4){ // a tap with the pen toggles the option under it; a tap on a writing box opens that box
      const o=optAt(p,...s.pts[0]);
      if(box){hist.pop();drawSheet(ctx,p);box.focus();return;}
      if(o){setOpt(o,!cur.sel[o.id]);save();drawSheet(ctx,p);renderTabs();}else hist.pop();
      return;
    }
    const hits=recognise(p,s);
    if(hits.length){hits.forEach(o=>setOpt(o,true));s.hits=hits.map(o=>o.id);toast('✓ '+hits.map(o=>o.v).join(', '));}
    cur.ink[p].push(s);save();drawSheet(ctx,p);renderTabs();
  };
  cv.onpointerup=end;cv.onpointercancel=end;
  /* With Finger on, a finger is the pen: a stroke that starts on a shaded writing box must draw, not focus the
     box (a plain tap still opens it). Handing the touch to the drawing layer captures the pointer, so the rest
     of the stroke follows it. The Pencil is untouched, so Scribble still writes into the boxes. */
  const isBox=t=>t&&t.classList&&t.classList.contains('bl');
  sheetEl.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch'||!SET.finger||!isBox(e.target)||e.target===cv)return;
    e.preventDefault();e.stopPropagation();fromBox=e.target;cv.onpointerdown(e);
  },true);
  sheetEl.addEventListener('touchstart',e=>{
    if(SET.finger&&isBox(e.target)&&![...e.touches].some(t=>t.touchType==='stylus'))e.preventDefault();
  },{capture:true,passive:false});
}
/* Keep the sheet fitted to the window. Width changes (rotation, split view, a window that is still
   opening) lay the sheet out again; height-only changes (keyboard, toolbars) just resize the viewport. */
let resizeT,fitW=0;
const availW=()=>document.documentElement.clientWidth;
function onViewportChange(){clearTimeout(resizeT);resizeT=setTimeout(()=>{
  if(view!=='edit'||!TABS[tab].page||!$('#sv'))return;
  const typing=document.activeElement&&document.activeElement.classList.contains('bl');
  if(Math.abs(availW()-fitW)>1&&!typing)renderSheet(sheetPage);
  else{sizeViewport();placeInk(false);}
},120);}
window.addEventListener('resize',onViewportChange);
window.addEventListener('orientationchange',onViewportChange);
if(window.visualViewport)visualViewport.addEventListener('resize',onViewportChange);
if(window.ResizeObserver)new ResizeObserver(onViewportChange).observe(document.documentElement);

/* The filled sheet as an image (background + circles + ink + typed text), for PDF and package. */
const jpeg=async c=>new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',0.85))).arrayBuffer());
async function sheetImage(p,k=2){return jpeg(await sheetCanvas(p,k));}
async function sheetCanvas(p,k=2){
  const pg=SHEET.pages[p-1],img=await loadBg(p);
  const c=document.createElement('canvas');c.width=pg.w*k;c.height=pg.h*k;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  g.setTransform(k,0,0,k,0,0);
  for(const m of cur.imgs.filter(m=>m.p===p)){ // inserted images sit under the circles and ink, as on screen
    const blob=refBlobs.get(m.id)||(await dbGet('photos',m.id)||{}).blob;if(!blob)continue;
    const bm=await createImageBitmap(blob);g.drawImage(bm,m.x,m.y,m.w,m.h);bm.close&&bm.close();
  }
  drawSelections(g,p);for(const st of cur.ink[p])drawStroke(g,st);
  g.fillStyle='#0b3d91';
  for(const b of SHEET.blanks.filter(b=>b.p===p&&cur.txt[b.id])){
    const fs=blankFont(b);g.font=`600 ${fs}px Helvetica, Arial, sans-serif`;
    const lh=b.h/b.lines,words=String(cur.txt[b.id]).split(/\s+/);let line='',row=0;
    const flush=()=>{g.fillText(line,b.x+2,b.y+lh*(row+0.5)+fs*0.35,b.w-4);row++;line='';}; // vertically centred, as on screen
    for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>b.w-4&&line&&row<b.lines-1){flush();line=w;}else line=t;}
    if(line)flush();
  }
  return c;
}

function attachImages(p,s){

/* ---------- Report (sheet order, tap to copy) ---------- */
function fieldValue(f){
  const vals=[...new Set((OPTS_OF[f.id]||[]).filter(o=>cur.sel[o.id]).map(o=>o.v))];
  for(const b of SHEET.blanks)if(b.of===f.id&&cur.txt[b.id])vals.push(cur.txt[b.id]);
  if(f.kind==='text'&&cur.txt[f.id])vals.push(cur.txt[f.id]);
  return vals.join(', ');
}
function reportData(){
  const out=[],idx={};
  const push=(sec,row)=>{if(!(sec in idx)){idx[sec]=out.length;out.push({title:sec,rows:[]});}out[idx[sec]].rows.push(row);};
  push('Assignment',['Inspection date',cur.date]);
  for(const f of SHEET.fields){const v=fieldValue(f);if(v)push(f.sec,[f.label,v]);}
  const sk=sketchTotals();
  for(const k in sk)push('Sketch',[k==='GLA'?'GLA (sf)':k+' (sf)',sk[k].toLocaleString()]);
  return out;
}

  ph.forEach((p,i)=>{const base=safe(p.label)||'Photo';seen[base]=(seen[base]||0)+1;const nm=`photos/${String(i+1).padStart(2,'0')} ${base}${seen[base]>1?' '+seen[base]:''}.jpg`;photoIndex.push({name:nm,label:photoCaption(p,i),ts:p.ts,p});});
  const refs=await refsFor(cur.id);
  const json={app:'FieldLite',v:2,insp:Object.assign({},cur,{_pc:undefined}),photos:photoIndex.map(x=>({file:x.name,label:x.label,ts:x.ts})),
    refs:refs.map(r=>({id:r.id,file:`refs/${r.id}.jpg`,label:r.label}))};
  try{files.push({name:'Field Notes.pdf',data:await buildPdf()});}catch(err){console.warn('PDF skipped',err);}
  for(let p=1;p<=SHEET.pages.length;p++)files.push({name:SHEET.pages.length>1?`Field sheet page ${p}.jpg`:'Field sheet.jpg',data:await sheetImage(p)});
  files.push({name:'Report.txt',data:enc.encode(reportText().replace(/\n/g,'\r\n'))});
  files.push({name:'Data.csv',data:enc.encode('﻿'+csvOf(data))});
  files.push({name:'inspection.json',data:enc.encode(JSON.stringify(json))});
  try{files.push({name:'TOTAL UAD 2.6.xml',data:enc.encode(uad26().xml)});}catch(err){console.warn('UAD 2.6 XML skipped',err);}
  if(cur.sketch.areas.length){const svg=sketchSVG(true);files.push({name:'Sketch.svg',data:enc.encode(svg)});try{files.push({name:'Sketch.png',data:await svgToPng(svg)});}catch(_){}}
  for(const x of photoIndex)files.push({name:x.name,data:new Uint8Array(await x.p.blob.arrayBuffer())});
  for(const r of refs)files.push({name:`refs/${r.id}.jpg`,data:new Uint8Array(await r.blob.arrayBuffer())});
  await deliver(makeZip(files),pkgName('zip'));
}
function pkgName(ext){return `${safe(addrOf(cur)||'Inspection')}${cur.txt.unit?' '+safe(cur.txt.unit):''} ${cur.date||today()}.${ext}`;}
async function deliver(blob,fname){
  // Phones/tablets get the share sheet (AirDrop, Mail, Files); computers get a download.
  const file=new File([blob],fname,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Mobi|Android|iPhone|iPad|Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>0){
    try{await navigator.share({files:[file],title:fname});return;}catch(err){if(err.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast('Saved '+fname);
}

/* ---------- PDF (uses the jsPDF inside the html2pdf bundle already shipped in ../vendor) ---------- */
async function newPdfDoc(){
  if(!window.html2pdf)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='../vendor/html2pdf.bundle.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('PDF library not available offline yet - open the app once with signal'));document.head.appendChild(sc);});
  // html2pdf doesn't expose jsPDF globally; render an empty element to get a fresh blank document
  // the size of the inspection sheet (8.5 x 14).
  return await window.html2pdf().set({margin:0,jsPDF:{unit:'pt',format:[612,1008],orientation:'portrait'}}).from(document.createElement('div')).toPdf().get('pdf');
}
async function imgSize(blob){try{const b=await createImageBitmap(blob);const r=[b.width,b.height];b.close&&b.close();return r;}catch(_){return [4,3];}}
async function buildPdf(){
  const doc=await newPdfDoc();
  // First: the filled-in inspection sheet exactly as marked, cut at its page breaks onto 8.5x14 pages.
  let first=true;
  for(let p=1;p<=SHEET.pages.length;p++){
    const pg=SHEET.pages[p-1],k=2,full=await sheetCanvas(p,k),cuts=[0,...(pg.breaks||[]),pg.h];
    const sc=Math.min((612-36)/pg.w,(1008-36)/Math.max(...cuts.slice(1).map((y,i)=>y-cuts[i])));
    for(let i=0;i<cuts.length-1;i++){
      const h=cuts[i+1]-cuts[i],c=document.createElement('canvas');c.width=pg.w*k;c.height=Math.round(h*k);
      c.getContext('2d').drawImage(full,0,-cuts[i]*k);
      if(!first)doc.addPage([612,1008],'p');first=false;
      doc.addImage(await jpeg(c),'JPEG',(612-pg.w*sc)/2,18,pg.w*sc,h*sc);
    }
  }
  const sheetPages=doc.getNumberOfPages();
  // Typed summary, sketch and photos on letter pages.
  const W=612,H=792,M=40,LW=170;let y=M;
  const newPage=()=>{doc.addPage('letter','p');y=M;};
  const need=h=>{if(y+h>H-M)newPage();};
  const title=titleOf();
  newPage();
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(title,M,y+12);y+=22;
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  doc.text(`Inspected ${cur.date||''}  |  Field notes summary`,M,y+8);y+=22;doc.setTextColor(0);
  for(const sec of reportData()){
    need(40);doc.setFillColor(31,78,121);doc.rect(M,y,W-2*M,18,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(11);
    doc.text(sec.title.toUpperCase(),M+6,y+13);doc.setTextColor(0);y+=24;
    doc.setFontSize(10);
    for(const [k,v] of sec.rows){
      const kl=doc.splitTextToSize(k,LW-8),vl=doc.splitTextToSize(String(v),W-2*M-LW);
      const h=Math.max(kl.length,vl.length)*12+4;need(h);
      doc.setFont('helvetica','normal');doc.setTextColor(90);doc.text(kl,M,y+9);
      doc.setTextColor(0);doc.setFont('helvetica','bold');doc.text(vl,M+LW,y+9);
      y+=h;doc.setDrawColor(220);doc.line(M,y-2,W-M,y-2);
    }
    y+=8;
  }
  if(cur.sketch.areas.length){
    const jpg=await svgToPng(sketchSVG(true),'image/jpeg');const [iw,ih]=await imgSize(new Blob([jpg],{type:'image/jpeg'}));
    newPage();doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Building Sketch',M,y+12);y+=22;
    const t=sketchTotals();doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(Object.entries(t).map(([k,v])=>`${k}: ${v.toLocaleString()} sf`).join('    '),M,y+8);y+=18;
    const k=Math.min((W-2*M)/iw,(H-M-y)/ih);doc.addImage(jpg,'JPEG',M,y,iw*k,ih*k);
  }
  const ph=await sentPhotos(cur.id);   // only photos ticked to send
  const cw=(W-2*M-12)/2,ch=(H-2*M-30)/3-20;
  for(let i=0;i<ph.length;i++){
    if(i%6===0){newPage();doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(i?'Photographs (cont.)':'Photographs',M,M+12);}
    const col=i%2,row=Math.floor((i%6)/2),x=M+col*(cw+12),yy=M+30+row*(ch+20);
    const [iw,ih]=await imgSize(ph[i].blob);const k=Math.min(cw/iw,ch/ih);
    doc.addImage(new Uint8Array(await ph[i].blob.arrayBuffer()),'JPEG',x+(cw-iw*k)/2,yy+(ch-ih*k)/2,iw*k,ih*k);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(photoCaption(ph[i],i),x+cw/2,yy+ch+13,{align:'center'});
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);const ph2=i<=sheetPages?1008:H;doc.setFontSize(8);doc.setTextColor(120);doc.text(`${title} - page ${i} of ${n}`,W/2,ph2-12,{align:'center'});doc.setTextColor(0);}
  return new Uint8Array(doc.output('arraybuffer'));
}

/* ---------- Import (office PC) ---------- */
async function importFiles(list){
  try{
    let z={};
    const zipF=list.find(f=>/\.zip$/i.test(f.name)||f.type==='application/zip');
    if(zipF)z=readZip(await zipF.arrayBuffer());
    else{
      // Unzipped package (e.g. Mac auto-extracted it): pick inspection.json plus the photos.
      for(const f of list){const key=/\.json$/i.test(f.name)?'inspection.json':'photos/'+f.name;z[key]=new Uint8Array(await f.arrayBuffer());}
    }
    if(!z['inspection.json'])throw new Error('No inspection.json in this package');
    const j=JSON.parse(new TextDecoder().decode(z['inspection.json']));
    const insp=normalize(j.insp);delete insp._pc;
    const exists=await dbGet('insp',insp.id);
    if(exists&&!confirm('This inspection is already on this device. Replace it with the imported copy?'))return;
    for(const p of await allFor(insp.id))await dbDel('photos',p.id);
    for(const p of j.photos){const d=z[p.file];if(d){const blob=new Blob([d],{type:'image/jpeg'});let thumb;try{thumb=await shrink(blob,320);}catch(_){}await dbPut('photos',{id:uid(),insp:insp.id,label:p.label,sel:true,ts:p.ts,blob,thumb});}}
    for(const r of j.refs||[]){const d=z[r.file]||z['photos/'+r.file.split('/').pop()];if(d)await dbPut('photos',{id:r.id,insp:insp.id,kind:'ref',label:r.label,ts:Date.now(),blob:new Blob([d],{type:'image/jpeg'})});}
    await dbPut('insp',insp);
    cur=insp;toast('Imported');tab=TABS.length-1;showEdit();
  }catch(err){alert('Import failed: '+err.message);}
}
$('#imp').onchange=e=>{const l=[...e.target.files];e.target.value='';if(l.length)importFiles(l);};

/* ---------- Navigation ---------- */
$('#homeBtn').onclick=()=>showHome();
$('#prevBtn').onclick=()=>{if(tab>0){tab--;renderTabs();renderSection();}};
$('#nextBtn').onclick=()=>{if(tab<TABS.length-1){tab++;renderTabs();renderSection();}};

/* ---------- Boot ---------- */
(async()=>{
  await openDB();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
    // A new version just took over: on the home screen reload straight into it; mid-inspection wait so nothing is lost.
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController)return;if(view==='home')location.reload();else toast('Update ready - it starts next time you open the app');});
  }
  showHome();
})();
